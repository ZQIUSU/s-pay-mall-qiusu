<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - s-pay-mall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .sms-group {
            display: flex;
            gap: 10px;
        }
        .sms-group input {
            flex: 1;
        }
        .sms-group button {
            padding: 12px 20px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s;
        }
        .sms-group button:hover {
            background: #5a6fd6;
        }
        .sms-group button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .login-btn:hover {
            opacity: 0.9;
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>登录</h1>
        <p>请使用手机号验证码登录</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" required>
        </div>
        <div class="form-group">
            <label for="code">验证码</label>
            <div class="sms-group">
                <input type="text" id="code" placeholder="请输入验证码" maxlength="6" required>
                <button type="button" id="sendCodeBtn">获取验证码</button>
            </div>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">登录</button>
    </form>
    <div class="back-link">
        <a href="index.html">返回首页</a>
    </div>
</div>

<script>
    var countdown = 0;
    var timer = null;
    var baseUrl = 'http://127.0.0.1:8082/api/v1';

    // 发送验证码
    document.getElementById('sendCodeBtn').addEventListener('click', function() {
        var phone = document.getElementById('phone').value.trim();
        if (!phone) {
            showError('请输入手机号');
            return;
        }
        if (!/^1\d{10}$/.test(phone)) {
            showError('请输入正确的手机号');
            return;
        }

        var btn = this;
        btn.disabled = true;
        countdown = 60;
        updateCountdown(btn);

        fetch(baseUrl + '/login/sms/send', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ phone: phone })
        })
        .then(response => response.json())
        .then(json => {
            if (json.code === '0000') {
                showError('验证码已发送', false);
            } else {
                showError(json.info || '发送失败');
                clearInterval(timer);
                btn.disabled = false;
                btn.textContent = '获取验证码';
            }
        })
        .catch(error => {
            showError('网络错误，请重试');
            clearInterval(timer);
            btn.disabled = false;
            btn.textContent = '获取验证码';
        });
    });

    function updateCountdown(btn) {
        timer = setInterval(function() {
            if (countdown <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.textContent = '获取验证码';
            } else {
                btn.textContent = countdown + 's';
                countdown--;
            }
        }, 1000);
    }

    // 登录
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var phone = document.getElementById('phone').value.trim();
        var code = document.getElementById('code').value.trim();

        if (!phone) {
            showError('请输入手机号');
            return;
        }
        if (!/^1\d{10}$/.test(phone)) {
            showError('请输入正确的手机号');
            return;
        }
        if (!code) {
            showError('请输入验证码');
            return;
        }

        var loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.textContent = '登录中...';

        fetch(baseUrl + '/login/sms/verify', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ phone: phone, code: code })
        })
        .then(response => response.json())
        .then(json => {
            if (json.code === '0000') {
                // 保存token到cookie
                document.cookie = 'loginToken=' + encodeURIComponent(json.data.token) + ';path=/;max-age=86400';
                document.cookie = 'userId=' + encodeURIComponent(json.data.userId) + ';path=/;max-age=86400';
                // 跳转到首页
                window.location.href = 'index.html';
            } else {
                showError(json.info || '登录失败');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        })
        .catch(error => {
            showError('网络错误，请重试');
            loginBtn.disabled = false;
            loginBtn.textContent = '登录';
        });
    });

    function showError(msg, isError) {
        var errorEl = document.getElementById('errorMsg');
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        errorEl.style.color = isError === false ? '#27ae60' : '#e74c3c';
    }
</script>
</body>
</html>
